version: '3.8'
services:
# ── Banco de Dados PostgreSQL ─────────────────────────────
db:
image: postgres:15-alpine
container_name: pedidofacil-db
restart: unless-stopped 
environment:
POSTGRES_DB: ${DB_NAME}
POSTGRES_USER: ${DB_USER}
POSTGRES_PASSWORD: ${DB_PASSWORD}
volumes:
- postgres_data:/var/lib/postgresql/data 
- ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
ports:
- "5432:5432"
healthcheck: 
test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
interval: 10s
timeout: 5s
retries: 5
start_period: 20s
networks:
- pedidofacil-network
# ── Backend Node.js ───────────────────────────────────────
backend:
build:
context: ./backend
dockerfile: Dockerfile
container_name: pedidofacil-backend
restart: unless-stopped
environment:
DB_HOST: db 
DB_PORT: ${DB_PORT}
DB_NAME: ${DB_NAME}
DB_USER: ${DB_USER}
DB_PASSWORD: ${DB_PASSWORD}
PORT: ${PORT}
ports:
- "3001:3001"
depends_on:
db:
condition: service_healthy
healthcheck: 
test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
interval: 15s
timeout: 5s
retries: 3
start_period: 20s
networks:
- pedidofacil-network
# ── Frontend React ────────────────────────────────────────
frontend:
build:
context: ./frontend
dockerfile: Dockerfile
args:
VITE_API_URL: ${VITE_API_URL}
container_name: pedidofacil-frontend
restart: unless-stopped 
ports:
- "3000:80"
depends_on:
backend:
condition: service_healthy 
networks:
- pedidofacil-network
# ── Volumes Persistentes ──────────────────────────────────
volumes:
postgres_data:
driver: local
# ── Rede Interna ──────────────────────────────────────────
networks:
pedidofacil-network:
driver: bridge
# - Fim - 